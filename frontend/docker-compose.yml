name: jobly

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  identity:
    build: ./backend/src/Services/Identity/Jobly.Identity.Api
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jobly_identity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5101:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  companies:
    build: ./backend/src/Services/Companies/Jobly.Companies.Api
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jobly_companies;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5102:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  jobs:
    build: ./backend/src/Services/Jobs/Jobly.Jobs.Api
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jobly_jobs;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5103:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reviews:
    build: ./backend/src/Services/Reviews/Jobly.Reviews.Api
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jobly_reviews;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5104:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  salaries:
    build: ./backend/src/Services/Salaries/Jobly.Salaries.Api
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jobly_salaries;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5105:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build: ./backend/src/Gateway/Jobly.Gateway
    environment:
      Cors__Origins__0: http://localhost:5173
    ports:
      - "5000:8080"
    depends_on:
      - identity
      - companies
      - jobs
      - reviews
      - salaries

  # Se activa con: docker compose --profile web up --build
  # (requiere haber creado antes la app de Vite en /frontend)
  frontend:
    profiles: ["web"]
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  pgdata:
